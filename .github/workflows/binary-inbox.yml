name: binary-inbox

on:
  push:
    paths:
      - "inbox/**"

permissions:
  contents: write

concurrency:
  group: binary-inbox-${{ github.ref }}
  cancel-in-progress: false

jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Decode base64 chunks
        run: |
          if [ ! -f inbox/manifest.json ]; then
            echo "no manifest yet — skipping"
            exit 0
          fi
          node .github/scripts/binary-inbox.mjs

      - name: Commit decoded binaries
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "chore: decode binary inbox [skip ci]"
          git push origin HEAD:${{ github.ref_name }}
